server:
  port: 8080
  servlet:
    context-path: /pezsoft/v1
    session:
      timeout: 21600s
  error:
    include-message: always

spring:
  datasource:
    driver-class-name: ${CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect